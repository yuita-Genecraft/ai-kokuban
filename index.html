<!doctype html>
<meta charset="utf-8">
<title>AI 黒板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
/* 配置：画面いっぱいの黒板（canvas）が1枚。操作は粉受けのすぐ上に並ぶ札だけ。直しの入力は上の式の所に出す（キーボードに隠れない） */
:root{
  --wood:#1d130c; --board:#10241d; --chalk:#f4f2e8; --chalk-dim:rgba(244,242,232,.5); --chalk-line:rgba(244,242,232,.6);
  --chalk-wash:rgba(244,242,232,.05); --chalk-press:rgba(244,242,232,.17); --yellow:#f6de7c; --pink:#f5a3b6; --slate:rgba(8,20,16,.93); --on-yellow:#1b180a;
  --hand:"Chalkboard SE","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--wood);color:var(--chalk);font-family:var(--hand);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
[hidden]{display:none!important}
#stage{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);overflow:hidden;background:var(--board)}
#gl{position:absolute;left:0;top:0;display:block;touch-action:none;outline:none}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;pointer-events:none;
  padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#edit{display:flex;gap:8px;margin-top:54px;pointer-events:auto}
#eq{flex:1 1 0;min-width:0;height:46px;box-sizing:border-box;padding:0 12px;font:500 18px/1 var(--mono);color:var(--yellow);background:var(--slate);
  border:1.5px solid var(--yellow);border-radius:10px 13px 9px 12px/12px 9px 13px 10px;-webkit-user-select:text;user-select:text;touch-action:manipulation}
#ok{flex:none;height:46px;padding:0 14px;font:700 14px/1 var(--hand);color:var(--on-yellow);background:var(--yellow);border:0;border-radius:10px 13px 9px 12px/12px 9px 13px 10px;touch-action:manipulation}
#toast{margin-top:auto;align-self:center;max-width:100%;padding:7px 14px;font:600 13px/1.3 var(--hand);color:var(--chalk);background:var(--slate);
  border:1px solid var(--chalk-dim);border-radius:999px;opacity:0;transition:opacity .25s}
#bar{display:flex;gap:8px;justify-content:center;margin-bottom:34px;pointer-events:auto}
#bar button{flex:1 1 0;min-width:0;max-width:96px;height:40px;padding:0;font:700 14px/1 var(--hand);letter-spacing:.05em;color:var(--chalk);background:var(--chalk-wash);
  border:1.5px solid var(--chalk-line);border-radius:11px 15px 10px 14px/13px 10px 15px 11px;text-shadow:0 0 7px var(--chalk-dim);touch-action:manipulation;cursor:pointer}
#bar button:nth-child(even){border-radius:14px 10px 15px 11px/10px 14px 11px 15px}
#bar button:active,#ok:active,#bar button.press{background:var(--chalk-press);transform:translateY(1px)}
#b-done.ready{color:var(--yellow);border-color:var(--yellow)}
#tap{position:fixed;z-index:9;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(255,255,255,.5);opacity:0;pointer-events:none}
#ok:active{background:var(--chalk)}
#bar button:focus-visible,#eq:focus-visible,#ok:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
#b-snd.off{color:var(--chalk-dim);border-color:var(--chalk-dim);text-decoration:line-through;text-shadow:none}
#err{position:fixed;z-index:9;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 14px);margin:0;padding:10px 12px;
  font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--pink);background:var(--slate);border:1px solid var(--pink);border-radius:8px;-webkit-user-select:text;user-select:text;max-height:60%;overflow:auto}
#stat{position:fixed;z-index:8;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 14px);font:11px/1 var(--mono);color:var(--chalk-dim);font-variant-numeric:tabular-nums;pointer-events:none}

<div id="stage"><canvas id="gl" aria-label="指で式を書く黒板"></canvas></div>
<div id="ui">
  <div id="edit" hidden><input id="eq" type="text" enterkeyhint="go" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="式を字で入れる" placeholder="y=x^2-3"><button id="ok" type="button">書く</button></div>
  <div id="toast" role="status"></div><div id="tap"></div>
  <div id="bar"><button id="b-done" type="button">書けた</button><button id="b-demo" type="button">お手本</button><button id="b-look" type="button">質感</button><button id="b-edit" type="button">入力</button><button id="b-wipe" type="button">消す</button><button id="b-snd" type="button" aria-label="音を出す・止める">♪</button></div>
</div>
<pre id="err" hidden></pre><div id="stat" hidden></div>
<script>
// 動かなくなった時は、理由を画面に字で出す。同じ文は重ねずに回数だけ・少し経つと自分で消える・触っても消える・［消す］でも消える
// keep＝起動できなかった時（黒板が出ない）だけ出したままにする
var ERRS=[],errTimer=0,BOOT_OK=false;
function clearErr(){ERRS=[];clearTimeout(errTimer);var el=document.getElementById('err');el.hidden=true;el.textContent='';}
function showErr(m,keep){var el=document.getElementById('err'),i,hit=null;m=String(m);
  for(i=0;i<ERRS.length;i++)if(ERRS[i].m===m)hit=ERRS[i];
  if(hit)hit.n++;else{ERRS.push({m:m,n:1});if(ERRS.length>3)ERRS.shift();}
  el.textContent=ERRS.map(function(e){return e.m+(e.n>1?' ×'+e.n:'');}).join('\n');el.hidden=false;
  clearTimeout(errTimer);if(!keep)errTimer=setTimeout(clearErr,6000);}
document.getElementById('err').addEventListener('pointerdown',function(e){e.stopPropagation();e.preventDefault();clearErr();});
window.addEventListener('error',function(e){showErr((e.message||'error')+(e.lineno?'（'+e.lineno+' 行）':''),!BOOT_OK);});
window.addEventListener('unhandledrejection',function(e){showErr(String(e.reason&&e.reason.message||e.reason),!BOOT_OK);});
</script>
<script>
// ===== 数式：読む・計算する・微分する =====
const FUNCS=['sqrt','sin','cos','tan','exp','log','ln','abs'];
const N=v=>['num',v], isN=(a,v)=>a[0]==='num'&&(v===undefined||a[1]===v);
function tokenize(s){
  s=s.replace(/\s+/g,'').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/π/g,'pi');
  const out=[];let i=0;
  while(i<s.length){
    const c=s[i];
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;out.push({t:'num',v:parseFloat(s.slice(i,j))});i=j;continue;}
    if(/[a-z]/i.test(c)){
      let hit=null;for(const f of FUNCS)if(s.startsWith(f,i)){hit=f;break;}
      if(hit){out.push({t:'fn',v:hit});i+=hit.length;continue;}
      if(s.startsWith('pi',i)){out.push({t:'var',v:'pi'});i+=2;continue;}
      out.push({t:'var',v:c});i++;continue;
    }
    if('+-*/^()='.includes(c)){out.push({t:c});i++;continue;}
    throw new Error('読めない字: '+c);
  }
  return out;
}
function parseExpr(src){
  const tk=typeof src==='string'?tokenize(src):src;let p=0;
  const peek=()=>tk[p],eat=t=>{if(!tk[p]||tk[p].t!==t)throw new Error('式の形が合いません');return tk[p++];};
  const startsFactor=t=>t&&(t.t==='num'||t.t==='var'||t.t==='fn'||t.t==='(');
  function expr(){let a=term();while(peek()&&(peek().t==='+'||peek().t==='-')){const o=tk[p++].t;const b=term();a=[o==='+'?'add':'sub',a,b];}return a;}
  function term(){let a=unary();for(;;){const t=peek();
    if(t&&(t.t==='*'||t.t==='/')){p++;const b=unary();a=[t.t==='*'?'mul':'div',a,b];}
    else if(startsFactor(t)){a=['mul',a,power()];}
    else break;}return a;}
  function unary(){if(peek()&&peek().t==='-'){p++;return ['neg',unary()];}if(peek()&&peek().t==='+'){p++;return unary();}return power();}
  function power(){const a=atom();if(peek()&&peek().t==='^'){p++;return ['pow',a,unary()];}return a;}
  function atom(){const t=peek();if(!t)throw new Error('式が途中で終わっています');
    if(t.t==='num'){p++;return N(t.v);}
    if(t.t==='var'){p++;return ['var',t.v];}
    if(t.t==='('){p++;const e=expr();eat(')');return e;}
    if(t.t==='fn'){p++;
      if(peek()&&peek().t==='^'){p++;const ex=atom();const arg=fnArg();return ['pow',['fn',t.v,arg],ex];}
      return ['fn',t.v,fnArg()];}
    throw new Error('式の形が合いません');}
  function fnArg(){const t=peek();if(!t)throw new Error('関数の中身がありません');
    if(t.t==='('){p++;const e=expr();eat(')');return e;}
    if(t.t==='-'){p++;return ['neg',fnArg()];}
    let a=power();while(peek()&&(peek().t==='num'||peek().t==='var'))a=['mul',a,power()];return a;}
  const e=expr();if(p<tk.length)throw new Error('式の形が合いません');return e;
}
function varsOf(a,set=new Set()){if(a[0]==='var'){if(a[1]!=='pi'&&a[1]!=='e')set.add(a[1]);}else if(a[0]!=='num')for(let i=1;i<a.length;i++)if(Array.isArray(a[i]))varsOf(a[i],set);return set;}
function toJS(a){switch(a[0]){
  case 'num':return '('+a[1]+')';
  case 'var':return a[1]==='pi'?'Math.PI':a[1]==='e'?'Math.E':a[1];
  case 'add':return '('+toJS(a[1])+'+'+toJS(a[2])+')';
  case 'sub':return '('+toJS(a[1])+'-'+toJS(a[2])+')';
  case 'mul':return '('+toJS(a[1])+'*'+toJS(a[2])+')';
  case 'div':return '('+toJS(a[1])+'/'+toJS(a[2])+')';
  case 'pow':return 'P('+toJS(a[1])+','+toJS(a[2])+')';
  case 'neg':return '(-'+toJS(a[1])+')';
  case 'fn':return ({ln:'Math.log',log:'Math.log10'}[a[1]]||'Math.'+a[1])+'('+toJS(a[2])+')';}}
// 負の数の奇数乗・立方根なども実数で返す累乗
function P(b,e){if(b>=0||Number.isInteger(e))return Math.pow(b,e);const q=1/e;if(Math.abs(q-Math.round(q))<1e-9&&Math.round(q)%2)return -Math.pow(-b,e);return NaN;}
function compile(a,args){return new Function('P',...args,'return '+toJS(a)).bind(null,P);}
function simp(a){
  if(a[0]==='num'||a[0]==='var')return a;
  if(a[0]==='fn'){const u=simp(a[2]);if(a[1]==='ln'&&u[0]==='var'&&u[1]==='e')return N(1);return ['fn',a[1],u];}
  const x=simp(a[1]),y=a.length>2&&Array.isArray(a[2])?simp(a[2]):a[2];
  switch(a[0]){
   case 'neg':if(isN(x))return N(-x[1]);if(x[0]==='neg')return x[1];return ['neg',x];
   case 'add':if(isN(x)&&isN(y))return N(x[1]+y[1]);if(isN(x,0))return y;if(isN(y,0))return x;if(y[0]==='neg')return simp(['sub',x,y[1]]);if(isN(y)&&y[1]<0)return ['sub',x,N(-y[1])];return ['add',x,y];
   case 'sub':if(isN(x)&&isN(y))return N(x[1]-y[1]);if(isN(y,0))return x;if(isN(x,0))return simp(['neg',y]);if(y[0]==='neg')return simp(['add',x,y[1]]);return ['sub',x,y];
   case 'mul':{let c=1;const fs=[];(function g(n){if(n[0]==='mul'){g(n[1]);g(n[2]);}else if(n[0]==='neg'){c=-c;g(n[1]);}else if(isN(n))c*=n[1];else if(n[0]==='div'&&isN(n[1])&&isN(n[2])&&n[2][1]!==0)c*=n[1][1]/n[2][1];else fs.push(n);})(['mul',x,y]);   // 数どうしの割り算は定数に畳む（8·1/2 → 4）
     if(c===0)return N(0);let r=null;for(const f of fs)r=r?['mul',r,f]:f;
     if(!r)return N(c);if(c===1)return r;if(c===-1)return ['neg',r];return c<0?['neg',['mul',N(-c),r]]:['mul',N(c),r];}
   case 'div':if(isN(x,0))return N(0);if(isN(y,1))return x;if(x[0]==='neg')return simp(['neg',['div',x[1],y]]);if(isN(x)&&x[1]<0)return ['neg',['div',N(-x[1]),y]];if(isN(y)&&x[0]==='mul'&&isN(x[1])&&Number.isInteger(x[1][1]/y[1]))return simp(['mul',N(x[1][1]/y[1]),x[2]]);if(isN(x)&&isN(y)&&y[1]!==0&&Number.isInteger(x[1]/y[1]))return N(x[1]/y[1]);if(isN(x)&&isN(y)&&y[1]!==0&&!Number.isInteger(y[1])){const q=x[1]/y[1];if(Math.abs(q*1e4-Math.round(q*1e4))<1e-9)return N(Math.round(q*1e4)/1e4);}return ['div',x,y];
   case 'pow':if(isN(y,0))return N(1);if(isN(y,1))return x;if(isN(x)&&isN(y))return N(P(x[1],y[1]));return ['pow',x,y];
   case 'fn':return ['fn',a[1],y];}
  return a;
}
function has(a,v){return varsOf(a).has(v);}
function diff(a,v){const d=x=>diff(x,v);
  switch(a[0]){
   case 'num':return N(0);
   case 'var':return N(a[1]===v?1:0);
   case 'neg':return ['neg',d(a[1])];
   case 'add':return ['add',d(a[1]),d(a[2])];
   case 'sub':return ['sub',d(a[1]),d(a[2])];
   case 'mul':return ['add',['mul',d(a[1]),a[2]],['mul',a[1],d(a[2])]];
   case 'div':if(!has(a[2],v))return ['div',d(a[1]),a[2]];return ['div',['sub',['mul',d(a[1]),a[2]],['mul',a[1],d(a[2])]],['pow',a[2],N(2)]];
   case 'pow':{const b=a[1],e=a[2];
     if(!has(e,v))return ['mul',['mul',e,['pow',b,simp(['sub',e,N(1)])]],d(b)];
     if(!has(b,v))return ['mul',['mul',a,['fn','ln',b]],d(e)];
     return ['mul',a,['add',['mul',d(e),['fn','ln',b]],['mul',e,['div',d(b),b]]]];}
   case 'fn':{const u=a[2],du=d(u);let o;
     switch(a[1]){
      case 'sin':o=['fn','cos',u];break;case 'cos':o=['neg',['fn','sin',u]];break;
      case 'tan':o=['div',N(1),['pow',['fn','cos',u],N(2)]];break;
      case 'exp':o=a;break;case 'ln':o=['div',N(1),u];break;
      case 'log':o=['div',N(1),['mul',u,['fn','ln',N(10)]]];break;
      case 'sqrt':o=['div',N(1),['mul',N(2),a]];break;
      case 'abs':o=['div',u,a];break;}
     return ['mul',o,du];}}
}
const D=(a,v)=>simp(simp(diff(a,v)));
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
function fmt(v,n=4){if(!isFinite(v))return '—';if(Math.abs(v)<5e-10)return '0';const a=Math.abs(v);
  if(a>=1e6||a<1e-3)return v.toExponential(2).replace('e+','e');let s=v.toPrecision(n);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');return s.replace('-','−');}
function show(a,prec=0){let s,p;
  switch(a[0]){
   case 'num':s=fmt(a[1],6);p=a[1]<0?1:9;break;
   case 'var':s=a[1]==='pi'?'π':a[1];p=9;break;
   case 'add':s=show(a[1],1)+' + '+show(a[2],1);p=1;break;
   case 'sub':s=show(a[1],1)+' − '+show(a[2],2);p=1;break;
   case 'neg':s='−'+show(a[1],3);p=2;break;
   case 'mul':{const L=show(a[1],3),R=show(a[2],3);
     const tight=(a[1][0]==='num')&&(a[2][0]!=='num');
     s=tight?L+R:(/^[0-9−]/.test(R)?L+'·'+R:L+' '+R);p=3;break;}
   case 'div':s=show(a[1],3)+'/'+show(a[2],4);p=3;break;
   case 'pow':{const e=a[2];
     if(isN(e)&&Number.isInteger(e[1]))s=show(a[1],5)+String(e[1]).split('').map(c=>SUP[c]).join('');
     else s=show(a[1],5)+'^'+show(e,5);p=5;break;}
   case 'fn':{const inner=show(a[2],0);s=(a[1]==='sqrt'?'√':a[1])+'('+inner+')';p=9;break;}}
  return p<prec?'('+s+')':s;
}
// ===== 数値の解析 =====
function roots(f,a,b,n=800){const r=[];let px=a,pv=f(a);
  for(let i=1;i<=n;i++){const x=a+(b-a)*i/n,v=f(x);
    if(isFinite(pv)&&isFinite(v)){
      if(v===0)r.push(x);
      else if(pv*v<0&&Math.abs(pv-v)<1e6){let lo=px,hi=x,fl=pv;for(let k=0;k<60;k++){const m=(lo+hi)/2,fm=f(m);if(fl*fm<=0)hi=m;else{lo=m;fl=fm;}}
        const m=(lo+hi)/2;if(Math.abs(f(m))<1e-6*(1+Math.abs(pv)+Math.abs(v)))r.push(m);}}
    px=x;pv=v;}
  return r.filter((x,i)=>i===0||Math.abs(x-r[i-1])>1e-7);
}
function simpson(f,a,b,n=2000){let s=0;const h=(b-a)/n;for(let i=0;i<=n;i++){const v=f(a+h*i);if(!isFinite(v))return NaN;s+=v*(i===0||i===n?1:i%2?4:2);}return s*h/3;}
if(typeof module!=='undefined')module.exports={tokenize,parseExpr,varsOf,compile,simp,D,show,fmt,roots,simpson,P};
// ===== 式の並びの費用（tools/hw/lm.js が作る・手で直さない）：行＝前の字種・列＝次の字種・値＝−10×ln 確率 =====
const HW_LM={k:"Dxyzk+-=()/.F^v$",c:[21,21,33,39,39,31,33,33,38,26,32,34,35,32,17,19,32,31,39,41,41,22,23,30,37,29,34,60,41,13,31,19,41,37,37,41,41,28,29,8,39,34,37,60,41,18,39,30,41,40,40,40,41,32,33,6,40,37,39,60,41,17,39,41,41,27,36,40,41,28,30,33,41,25,29,60,41,8,41,26,8,19,24,26,28,60,60,60,25,60,60,60,23,60,60,60,8,17,27,32,28,60,60,60,25,60,60,60,23,60,60,60,10,19,31,36,30,60,27,60,25,60,60,60,23,60,60,23,10,11,24,32,33,60,35,60,28,60,60,60,35,60,60,60,41,37,41,41,41,20,22,25,26,41,38,60,41,15,41,16,7,15,26,32,24,60,60,60,33,60,60,60,33,60,60,60,0,60,60,60,60,60,60,60,60,60,60,60,60,60,60,60,19,11,23,31,27,60,60,60,13,60,60,60,60,33,60,60,4,25,32,33,33,60,24,60,33,60,60,60,60,60,60,60,40,24,34,39,40,12,16,18,40,29,36,60,40,60,60,40,16,23,12,20,32,60,30,60,26,60,60,60,27,60,60,60]};

const GLYPHS={

const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function smooth(pts){if(pts.length<3)return pts;const o=[];
  for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    for(let k=0;k<8;k++){const t=k/8,t2=t*t,t3=t2*t;
      o.push({x:.5*(2*p1.x+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
              y:.5*(2*p1.y+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)});}}
  o.push(pts[pts.length-1]);return o;}
function glyphStrokes(ch,v=0){const defs=GLYPHS[ch];if(!defs)return null;const d=defs[v%defs.length];
  return d.split(';').map(s=>{const sharp=s[0]==='!';const pts=(sharp?s.slice(1):s).trim().split(/\s+/).map(q=>{const [x,y]=q.split(',').map(Number);return {x,y};});return sharp?pts:smooth(pts);});}
function bbox(strokes){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const s of strokes)for(const p of s){if(p.x<x0)x0=p.x;if(p.x>x1)x1=p.x;if(p.y<y0)y0=p.y;if(p.y>y1)y1=p.y;}
  return {x0,y0,x1,y1,w:x1-x0,h:y1-y0,cx:(x0+x1)/2,cy:(y0+y1)/2};}
const NP=32;
function cloud(strokes){ // 画をまたいで等間隔に NP 点を取り、大きさと位置をそろえる
  const segs=[];let total=0;for(const s of strokes)for(let i=1;i<s.length;i++){const l=dist(s[i-1],s[i]);if(l>0){segs.push([s[i-1],s[i],l]);total+=l;}}
  const pts=[];if(!segs.length){const p=strokes[0][0];for(let i=0;i<NP;i++)pts.push({x:p.x,y:p.y});}
  else{let si=0,acc=0;for(let k=0;k<NP;k++){const target=total*k/(NP-1);while(si<segs.length-1&&acc+segs[si][2]<target){acc+=segs[si][2];si++;}
      const [a,b,l]=segs[si];const t=Math.min(1,Math.max(0,(target-acc)/l));pts.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});}}
  const b=bbox([pts]);const sc=Math.max(b.w,b.h)||1;let cx=0,cy=0;for(const p of pts){cx+=p.x;cy+=p.y;}cx/=NP;cy/=NP;
  return {pts:pts.map(p=>({x:(p.x-cx)/sc,y:(p.y-cy)/sc})),ar:Math.log((b.w+sc*.08)/(b.h+sc*.08)),n:strokes.length};}
function cloudDist(a,b,start){const used=new Uint8Array(NP);let sum=0,i=start;
  do{let best=1e9,bj=-1;for(let j=0;j<NP;j++)if(!used[j]){const d=(a[i].x-b[j].x)**2+(a[i].y-b[j].y)**2;if(d<best){best=d;bj=j;}}
    used[bj]=1;sum+=(1-((i-start+NP)%NP)/NP)*Math.sqrt(best);i=(i+1)%NP;}while(i!==start);return sum;}
function matchCost(c,t){let d=1e9;for(let i=0;i<NP;i+=5)d=Math.min(d,cloudDist(c.pts,t.pts,i),cloudDist(t.pts,c.pts,i));
  return d*(1+.55*Math.abs(c.ar-t.ar))+.45*Math.abs(c.n-t.n);}
// 使う人が［入力］で直した字は、その人の手本として覚える（点の並びの近さで照らす）。読みの本体は 22-hw.js
const USER_TPL=[];
function addUserTemplate(ch,strokes){USER_TPL.push({ch,c:cloud(strokes)});}
function userCosts(strokes){if(!USER_TPL.length)return null;const c=cloud(strokes),cost={};for(const t of USER_TPL){const d=matchCost(c,t.c);if(!(t.ch in cost)||d<cost[t.ch])cost[t.ch]=d;}return cost;}

// 全部の画の凸包を取り、頂点を「取っても面積が減りにくい順」に減らして 4角形・6角形にする。

    const cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2,L=plen(s)||1,bow=(Math.random()-.5)*Math.min(L*.2,h*.24),f1=(Math.random()-.5)*5,f2=Math.random()*6.28,f3=5+Math.random()*6,sx=.88+Math.random()*.24,sy=.88+Math.random()*.24;

    for(let i=0;i<s.length;i++){const p=s[i];if(i)acc+=Math.hypot(p.x-s[i-1].x,p.y-s[i-1].y);const t=acc/L;
      const x=(p.x-cx)*sx*sc,y=(p.y-cy)*sy*sc,X=cx+x*Math.cos(rot)-y*Math.sin(rot),Y=cy+dy+x*Math.sin(rot)+y*Math.cos(rot);
      const q=s[Math.min(s.length-1,i+1)],r=s[Math.max(0,i-1)],dx=q.x-r.x,dyy=q.y-r.y,l=Math.hypot(dx,dyy)||1;
      const w=bow*Math.sin(Math.PI*t)+f1*Math.sin(t*f3+f2)+(Math.random()-.5)*1.4;   // 線に直交する揺れ＝弓なり＋震え＋ざらつき
      o.push({x:X-dyy/l*w,y:Y+dx/l*w});}
    if(o.length>1&&Math.random()<.6){const a=o[o.length-2],c=o[o.length-1],l=Math.hypot(c.x-a.x,c.y-a.y)||1,e=2+Math.random()*5;o.push({x:c.x+(c.x-a.x)/l*e,y:c.y+(c.y-a.y)/l*e});}   // 終わりを少し行き過ぎる
    out.push(o);}
  return out;}
// 汚い字が整う：書き終わった手の字 a を、同じ画・同じ点の数に合わせた整った字 b へ、少しずつ描き直す（粗い四角が整うのと同じ見せ方）
const MORPH={on:false};
// ボタンを押す様子（お手本が「書けた」を押す）：押し込み 0.2 秒＋指の波紋 0.45 秒。黒板の時計で進める（録画でも同じ速さ）
const TAP={t0:-1,id:null,x:0,y:0};
function tapFx(id){const b=byId(id),r=b.getBoundingClientRect();TAP.t0=APP.t;TAP.id=id;TAP.x=r.left+r.width/2;TAP.y=r.top+r.height/2;}
function tapStep(){const u=(APP.t-TAP.t0)/.45,el=byId('tap'),b=byId(TAP.id);
  if(u>=1){TAP.t0=-1;el.style.opacity=0;b.classList.remove('press');return;}
  b.classList.toggle('press',u<.45);el.style.left=TAP.x+'px';el.style.top=TAP.y+'px';el.style.transform='scale('+(.5+1.3*u).toFixed(3)+')';el.style.opacity=(.55*(1-u)).toFixed(3);}
const ptAt=(c,d)=>{let acc=0;for(let i=1;i<c.length;i++){const l=Math.hypot(c[i].x-c[i-1].x,c[i].y-c[i-1].y);if(acc+l>=d){const u=l?(d-acc)/l:0;return {x:c[i-1].x+(c[i].x-c[i-1].x)*u,y:c[i-1].y+(c[i].y-c[i-1].y)*u};}acc+=l;}const e=c[c.length-1];return {x:e.x,y:e.y};};
const alignTo=(clean,messy)=>messy.map((s,i)=>{const c=resample(clean[i]||s,3),L=plen(s)||1,Lc=plen(c)||1;let acc=0;
  return s.map((p,j)=>{if(j)acc+=Math.hypot(p.x-s[j-1].x,p.y-s[j-1].y);return ptAt(c,Math.min(1,acc/L)*Lc);});});
function morphInk(a,b,dur){MORPH.on=true;MORPH.a=a;MORPH.b=b;MORPH.t0=APP.t;MORPH.dur=dur;}
function morphStep(){if(!MORPH.on)return;const u=Math.min(1,(APP.t-MORPH.t0)/MORPH.dur),e=1-Math.pow(1-u,3);   // シュッ（速く始まり、すっと止まる）
  INK.strokes=MORPH.a.map((s,i)=>s.map((p,j)=>{const q=MORPH.b[i][j];return {x:p.x+(q.x-p.x)*e,y:p.y+(q.y-p.y)*e};}));
  redrawInk();if(u>=1){MORPH.on=false;INK.strokes=MORPH.b;redrawInk();const b=bbox(INK.strokes);Dust.emit(b.cx,b.cy,26,70,8);}}   // 整った瞬間に粉
// 人が書くように：画の始めと終わりは遅く途中は速く、画の間に小さな間、字の間に少し長い間（たまに考える）、途中でふと止まる
function humanWrite(st,t,speed=240){let px1=-1e9,tot=0;for(const s of st)tot+=plen(s);const long=Math.min(1,Math.max(0,(tot-700)/900));speed*=1+.3*long;   // 長い式は少し速く（間も短く）
  for(const s of st){const b=bbox([s]);t+=(b.x0>px1+8?.2+Math.random()*.3+(Math.random()<.25-.1*long?.5:0):.08+Math.random()*.12)*(1-.25*long);px1=Math.max(px1,b.x1);
    const n=Math.max(1,Math.min(6,Math.round(plen(s)/28))),r0=INK_R*(.9+Math.random()*.2);
    for(let k=0;k<n;k++){const i0=Math.floor(k*(s.length-1)/n),i1=Math.ceil((k+1)*(s.length-1)/n),seg=s.slice(i0,i1+1),sp=speed*(.4+.6*Math.sin(Math.PI*(k+.5)/n))*(.7+.5*Math.random());
      const r=r0*(.9+Math.random()*.2);t=Pen.add('U',seg,CHALK.white,r,t,Math.max(.02,plen(seg)/sp),1,1);if(Math.random()<.22)t+=.06+Math.random()*.12;}}
  return t;}
function demoWrite(rows,look,sc){if(rows[0]==='□'){bxDemoWrite(look,sc);return;}   // 箱の絵のお手本
  const want=rows.join('');let st=demoStrokes(rows,.08),rd=null;
  try{rd=readAll(st);}catch(e){}
  if(!rd||normEq(rd.text)!==normEq(want)){st=demoStrokes(rows,0);try{rd=readAll(st);}catch(e){rd=null;}}
  st=humanize(st,bbox(st).h);const clean=alignTo(demoStrokes(rows,0),st);   // 見せる字は人の手の形（読みは整った字で済ませてある）・clean＝整った字（点の数は手の字に合わせる）
  APP.demoRead=rd?normEq(rd.text):'';APP.mode='demo';let t=humanWrite(st,.25);
  Seq.at(t+.7,()=>tapFx('b-done'));                                    // 書き終わって少し間→「書けた」を押す
  Seq.at(t+.9,()=>{INK.strokes=st;morphInk(st,clean,.4);});             // シュッと整う
  Seq.at(t+1.55,()=>{INK.strokes=clean;INK.read=rd;INK.look=look;INK.sc=sc;APP.mode='write';run(want);});}
function demoNext(){demoI=(demoI+1)%DEMOS.length;const d=DEMOS[demoI];wipeStart(()=>demoWrite(d[0],d[1],d[2]));}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.opacity=1;toast.until=APP.t+1.5;}   // 消すのは tick（黒板の時計で）
// --- 直しの入力：読んだ字を見せて、字で直してもらう ---
function editOpen(){if(APP.mode==='wipe'||APP.mode==='demo')return;const el=document.getElementById('edit'),inp=document.getElementById('eq');inp.value=INK.text||(INK.read?INK.read.text:'');el.hidden=false;inp.focus();}
function editClose(){document.getElementById('edit').hidden=true;document.getElementById('eq').blur();}
const SUPN='⁰¹²³⁴⁵⁶⁷⁸⁹';   // 全角・肩の数字・長音の「ー」も受ける
const normIn=v=>v.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+[...m].map(c=>SUPN.indexOf(c)).join('')).normalize('NFKC').toLowerCase().replace(/[ー−–—‐]/g,'-').replace(/÷/g,'/').replace(/\s+/g,'');
function editDone(){const v=normIn(document.getElementById('eq').value);editClose();if(!v||APP.mode==='wipe'||APP.mode==='demo')return;
  if(INK.strokes.length){const n=learn(v);if(n)toast('字を '+n+' つ覚えました');rerun(v);return;}
  if([...v].every(ch=>ch==='^'||GLYPHS[ch]))wipeStart(()=>demoWrite([v]));else toast('黒板が書けない字が入っています');}
function rerun(text){free3D();Pen.clear();Seq.clear();clearT(T.G);clearT(T.D);Lab.wipeAll();S2.on=false;S2.auto=null;APP.job=null;redrawInk();
  APP.mode='write';INK.tLast=1e9;INK.msg=false;run(text);}
// --- 字を覚える：読み違えた字の画を、その人の手本として足す（端末の中に保存） ---
const TPL=[];
function learn(text){const r=INK.read;if(!r||!r.syms||!r.toks)return 0;let rs='';
  for(let k=0;k<r.toks.length;k++){const t=r.toks[k],span=(k+1<r.toks.length?r.toks[k+1].i:r.syms.length)-t.i;if(t.tok.length!==span)return 0;rs+=t.tok;}
  const cand=[text.replace(/\^\(([^()]*)\)/g,'$1').replace(/\^/g,''),text.replace(/\^/g,'')].find(c=>c.length===rs.length);if(!cand)return 0;
  const df=[];for(let i=0;i<rs.length;i++)if(rs[i]!==cand[i])df.push(i);
  if(!df.length||df.length>3||df.some(i=>!GLYPHS[cand[i]]))return 0;
  for(const i of df){const st=r.syms[i].strokes;addUserTemplate(cand[i],st);TPL.push([cand[i],st.map(s=>s.map(p=>[Math.round(p.x),Math.round(p.y)]))]);}
  while(TPL.length>60)TPL.shift();try{localStorage.setItem('ai-kokuban-tpl',JSON.stringify(TPL));}catch(e){}
  return df.length;}
function loadTpl(){try{const a=JSON.parse(localStorage.getItem('ai-kokuban-tpl')||'[]');
    for(const [ch,st] of a){if(!GLYPHS[ch])continue;addUserTemplate(ch,st.map(s=>s.map(p=>({x:p[0],y:p[1]}))));TPL.push([ch,st]);}}catch(e){}}
// ===== 起動・ボタン・画面の大きさの変化 =====
const byId=id=>document.getElementById(id);
function onTap(id,fn){byId(id).addEventListener('click',e=>{e.preventDefault();Snd.wake();if(!APP.dead)fn();});}
function refit(){free3D();Pen.clear();Seq.clear();S2.on=false;S2.auto=null;APP.job=null;APP.after=null;PT.clear();
  Object.assign(INK,{strokes:[],cur:null,msg:false,tLast:1e9,c:null,text:'',read:null});APP.mode='write';fit();hint();}
let fitTimer=0;
window.addEventListener('resize',()=>{clearTimeout(fitTimer);fitTimer=setTimeout(()=>{if(APP.dead||!byId('edit').hidden)return;
  const [w,h]=stageSize(),empty=APP.mode==='write'&&!INK.strokes.length&&!INK.cur;
  if(Math.abs(w-APP.fitW)>2||Math.abs(h-APP.fitH)>140||(empty&&h!==APP.fitH))refit();},250);});
function boot(){loadTpl();fit();
  const qs=location.search,arg=k=>{const m=qs.match(new RegExp('[?&]'+k+'=([^&]*)'));return m?decodeURIComponent(m[1]):null;};
  const lk=arg('look')===null?undefined:+arg('look'),hs=arg('hd')?arg('hd').split(';').map(s=>s.split(',').map(Number)):undefined;   // hd＝確かめ用：点を置いて引く台本
  onTap('b-done',finishWrite);
  onTap('b-demo',demoNext);
  onTap('b-look',()=>{const n=nextLook();toast(n?'質感：'+n:'立体が出ている時に替えられます');});
  onTap('b-edit',editOpen);
  onTap('b-wipe',()=>{clearErr();wipeStart();});
  onTap('b-snd',()=>byId('b-snd').classList.toggle('off',!Snd.toggle()));
  onTap('ok',editDone);
  byId('eq').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();editDone();}else if(e.key==='Escape')editClose();});
  // 入力の外を触ったら閉じる（その指は黒板へ渡さない）
  window.addEventListener('pointerdown',e=>{const ed=byId('edit');if(!ed.hidden&&!ed.contains(e.target)){e.stopPropagation();e.preventDefault();editClose();}},true);
  window.addEventListener('pointerup',()=>Snd.wake(),true);   // 指を離した時は音を鳴らしてよい合図になる
  if(arg('nobar')){byId('bar').style.display='none';LAY.barH=0;fit();}   // 動画では下の段を隠して図を大きく
  try{if(arg('movie'))MOVIE.start();else if(arg('eq'))demoWrite(arg('eq').split('|'),lk,hs);
    else if(arg('demo')){const d=DEMOS[demoI=(Math.max(1,+arg('demo')||1)-1)%DEMOS.length];demoWrite(d[0],lk===undefined?d[1]:lk,hs||d[2]);}
    else hint();}catch(e){hint();toast(String(e.message||e));}
  if(arg('stat')){const el=byId('stat');el.hidden=false;let n0=0,t0=performance.now();   // 確かめ用：毎秒の枚数と描く大きさ
    setInterval(()=>{const t=performance.now();el.textContent=Math.round((APP.frames-n0)*1000/(t-t0))+' fps · '+W+'×'+H+' · 立体×'+APP.q3;n0=APP.frames;t0=t;},1000);}
  // 確かめ用：指の代わりに pointer の出来事を黒板へ流す（pe=t0,秒,x,y,x,y,…|…　1本＝1画・点が1つなら軽く叩く）
  const pe=arg('pe')?arg('pe').split('|').map(s=>{const a=s.split(',').map(Number),p=[];for(let i=2;i<a.length;i+=2)p.push([a[i],a[i+1]]);
    const L=[0];for(let i=1;i<p.length;i++)L.push(L[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));return {t0:a[0],dur:a[1],p,L,ph:0};}):null;
  const peAt=(s,u)=>{const d=u*s.L[s.L.length-1];let i=1;while(i<s.L.length-1&&s.L[i]<d)i++;const a=s.p[i-1],b=s.p[i],f=(s.L[i]-s.L[i-1])>0?(d-s.L[i-1])/(s.L[i]-s.L[i-1]):0;return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];};
  const peFire=(type,q)=>{const r=cv.getBoundingClientRect();cv.dispatchEvent(new PointerEvent(type,{clientX:r.left+q[0],clientY:r.top+q[1],pointerId:1,pointerType:'touch',isPrimary:true,bubbles:true,cancelable:true,pressure:.5}));};
  const peStep=()=>{if(!pe)return;for(const s of pe){if(s.ph===2||APP.t<s.t0)continue;
    if(s.ph===0){peFire('pointerdown',s.p[0]);s.ph=1;if(s.p.length===1){s.ph=2;peFire('pointerup',s.p[0]);}continue;}
    const u=(APP.t-s.t0)/s.dur;if(u>=1){peFire('pointermove',s.p[s.p.length-1]);peFire('pointerup',s.p[s.p.length-1]);s.ph=2;}else peFire('pointermove',peAt(s,u));}};
  const ff=+arg('ff')||0;if(ff>0){APP.ff=true;let ts=0;while(APP.t<ff&&!APP.dead){peStep();loop(ts+=1000/60);}APP.ff=false;}   // 確かめ用：先へ進めてから見せる
  if(arg('rec')){REC.on=true;APP.ff=true;let ts=0;   // 録画：tools/rec.js が1コマずつ進めて写し、音の記録を受け取る
    window.recStep=()=>{REC.lv=0;REC.air=0;REC.pull=0;loop(ts+=1000/60);return JSON.stringify({t:APP.t,lv:REC.lv,air:REC.air,pull:REC.pull,pf:REC.pullF,ev:REC.ev.splice(0),end:!MOVIE.on&&APP.t>1});};}
  else requestAnimationFrame(loop);
  BOOT_OK=true;}
boot();
</script>
